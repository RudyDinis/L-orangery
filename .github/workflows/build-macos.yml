
name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build macOS app
        run: npx electron-builder --mac dmg zip --publish never

      - name: Upload macOS builds
        uses: actions/upload-artifact@v4
        with:
          name: macOS-build
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
